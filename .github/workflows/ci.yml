name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, exam, codex/exam-self-registration, codex/exam-organizer-registration]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check src/ tests/

      - name: Run ruff formatter check
        run: ruff format --check src/ tests/

  # type-check:
  #   name: Type Check
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}

  #     - name: Install dependencies
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install mypy
  #         pip install -e ".[dev]"

  #     - name: Run mypy
  #       run: mypy src/

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    # Гейт дрейфа: baseline поднимает схему с нуля, затем `alembic check`
    # сравнивает её с моделями. Любое расхождение (забытый индекс в модели,
    # колонка без миграции, тип) валит сборку — на прод такое попасть не
    # сможет молча.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_db
      EXAM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_db
      QUESTION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_db
      REGISTRATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_db
      SECRET_KEY: ci-secret-key-not-used-for-crypto
      ENVIRONMENT: ci
      AUTO_CREATE_TABLES: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Fail on schema drift
        run: alembic check

      - name: Migration is reversible
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Verify registrations on disposable PostgreSQL
        run: pytest tests/integration/test_exam_registrations_db.py tests/integration/test_exam_organizer_db.py --no-cov

      - name: Verify exams on disposable PostgreSQL
        run: pytest tests/integration/test_exams_db.py --no-cov

      - name: Verify project type questions on disposable PostgreSQL
        run: pytest tests/integration/test_project_type_questions_db.py --no-cov

  test:
    name: Tests
    runs-on: ubuntu-latest
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: test_db
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"

      # - name: Create .env file
      #   run: |
      #     cat > .env << EOF
      #     DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
      #     SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/test_db
      #     SECRET_KEY=test-secret-key-for-testing-only
      #     ALGORITHM=HS256
      #     ACCESS_TOKEN_EXPIRE_MINUTES=30
      #     LOG_LEVEL=DEBUG
      #     EOF

      - name: Run pytest
        run: pytest

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
