name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches:
      [main, develop, exam, codex/exam-self-registration, codex/exam-organizer-registration, codex/exam-attempts, codex/exam-queue, codex/project-type-questions, codex/exam-websocket]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check src/ tests/

      - name: Run ruff formatter check
        run: ruff format --check src/ tests/

  # type-check:
  #   name: Type Check
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}

  #     - name: Install dependencies
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install mypy
  #         pip install -e ".[dev]"

  #     - name: Run mypy
  #       run: mypy src/

  postgres:
    name: PostgreSQL (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep integration groups balanced by the previous CI job's file timings.
        include:
          - name: schema
            tests: ""
          - name: integration-1
            tests: >-
              tests/integration/test_exam_attempts_db.py
              tests/integration/test_exam_results_db.py
              tests/integration/test_exam_csv_db.py
              tests/integration/test_audience_db.py
              tests/integration/test_exam_reliability_db.py
              tests/integration/test_exam_live_load_ws.py
              tests/integration/test_project_relations_db.py
          - name: integration-2
            tests: >-
              tests/integration/test_exam_registrations_db.py
              tests/integration/test_exam_organizer_db.py
              tests/integration/test_exam_demo_api.py
              tests/integration/test_exam_participation_db.py
              tests/integration/test_exam_eta_db.py
              tests/integration/test_exam_assessment_api.py
              tests/integration/test_assessment_snapshot_db.py
          - name: integration-3
            tests: >-
              tests/integration/test_exam_acceptance_db.py
              tests/integration/test_exam_queue_db.py
              tests/integration/test_project_type_questions_db.py
              tests/integration/test_exam_manual_result_db.py
              tests/integration/test_exam_assessment_submit_db.py
              tests/integration/test_exam_live_db.py
              tests/integration/test_exam_assessment_submit_api.py
          - name: integration-4
            tests: >-
              tests/integration/test_exam_live_ws.py
              tests/integration/test_exams_db.py
              tests/integration/test_exam_csv_http.py
              tests/integration/test_exam_schedule_db.py
              tests/integration/test_exam_assessment_db.py
              tests/integration/test_exam_results_registry_db.py
              tests/integration/test_exam_scale_api.py

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_db
      EXAM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_db
      QUESTION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_db
      REGISTRATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_db
      SECRET_KEY: ci-secret-key-not-used-for-crypto
      ENVIRONMENT: ci
      AUTO_CREATE_TABLES: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations to an empty database
        if: ${{ matrix.tests == '' }}
        run: alembic upgrade head

      - name: Fail on schema drift
        if: ${{ matrix.tests == '' }}
        run: alembic check

      - name: Migration is reversible
        if: ${{ matrix.tests == '' }}
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Run PostgreSQL integration tests
        if: ${{ matrix.tests != '' }}
        env:
          TEST_FILES: ${{ matrix.tests }}
          EXAM_LOAD_CLIENTS: "40"
          EXAM_LOAD_ASSESSORS: "40"
        run: |
          test -n "$REGISTRATION_TEST_DATABASE_URL"
          read -r -a files <<< "$TEST_FILES"
          pytest "${files[@]}" --no-cov

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: postgres
    # Preserve the required check for both schema and integration jobs.
    if: ${{ always() }}
    steps:
      - name: Require successful PostgreSQL checks
        env:
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          if [[ "$POSTGRES_RESULT" != success ]]; then
            echo "::error::PostgreSQL checks finished with status: $POSTGRES_RESULT"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: test_db
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"

      # - name: Create .env file
      #   run: |
      #     cat > .env << EOF
      #     DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
      #     SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/test_db
      #     SECRET_KEY=test-secret-key-for-testing-only
      #     ALGORITHM=HS256
      #     ACCESS_TOKEN_EXPIRE_MINUTES=30
      #     LOG_LEVEL=DEBUG
      #     EOF

      - name: Run pytest
        run: pytest

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
